  /v1/domain:
    get:
      operationId: public_get_v1_domain
      tags:
      - Domains
      summary: List domains
      description: Returns a paginated list of Domain
      security:
      - BearerAuth: []
      parameters:
      - in: header
        name: X-Tenant-ID
        required: true
        description: Active team ID. Must match the tenant bound to a diagnostic token.
        schema:
          type: string
      - in: query
        name: page
        required: false
        description: Page number
        schema:
          type: integer
          default: 1
          minimum: 1
      - in: query
        name: per_page
        required: false
        description: Items per page
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: List of Domain
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        created_at:
                          type: integer
                          format: int64
                          description: ' (Unix timestamp)'
                        deleted_at:
                          type: integer
                          format: int64
                          description: ' (Unix timestamp)'
                          default: 0
                        domain_id:
                          type: string
                          format: ksuid
                        hostname:
                          type: string
                          description: User-owned custom hostname; adios.dev and adios.run
                            namespaces are reserved for platform-managed routes
                          minLength: 3
                          maxLength: 255
                        redirect_to:
                          type: string
                          description: Optional URL or hostname to redirect to (e.g.
                            https://www.adios.dev)
                        scope:
                          type: string
                          description: 'Authorized hostname scope: exact permits only
                            hostname; subtree also permits descendant hostnames. New
                            registrable domains default to subtree, new subdomains
                            default to exact, and existing records remain subtree
                            for backward compatibility.'
                          enum:
                          - exact
                          - subtree
                        status:
                          type: string
                          description: Domain verification status
                          default: pending
                          enum:
                          - pending
                          - verified
                        team_id:
                          type: string
                          format: ksuid
                        updated_at:
                          type: integer
                          format: int64
                          description: ' (Unix timestamp)'
                        verification_hostname:
                          type: string
                          description: DNS name that must be configured as a CNAME
                            for ownership verification
                          maxLength: 255
                        verification_parent_id:
                          type: string
                          format: ksuid
                          description: Verified parent domain claim from which this
                            hostname inherited verification; empty for direct DNS
                            verification
                        verification_value:
                          type: string
                          description: Expected CNAME value for ownership verification
                          maxLength: 255
                        verified_at:
                          type: integer
                          format: int64
                          description: ' (Unix timestamp)'
                          default: 0
                        workload_id:
                          type: string
                          format: ksuid
                      required:
                      - domain_id
                      - team_id
                      - hostname
                      - created_at
                      - updated_at
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        description: Current page number
                      per_page:
                        type: integer
                        description: Number of items per page
                      total:
                        type: integer
                        description: Total number of items
              example:
                data:
                - created_at: 1791072000
                  deleted_at: 0
                  domain_id: '000000000000000000000000001'
                  hostname: app.example.com
                  redirect_to: example
                  scope: exact
                  status: pending
                  team_id: '000000000000000000000000001'
                  updated_at: 1791072000
                  verification_hostname: example
                  verification_parent_id: '000000000000000000000000001'
                  verification_value: example
                  verified_at: 0
                  workload_id: '000000000000000000000000001'
                pagination:
                  page: 1
                  per_page: 1
                  total: 1
